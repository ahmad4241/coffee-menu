    <style>
        :root {
            --bg-primary: #f4f4f4;
            --bg-secondary: white;
            --text-primary: #333;
            --text-secondary: #666;
            --gold: #B8860B;
            --gold-dark: #8B6914;
        }
        body.dark-mode {
            --bg-primary: #000000;
            --bg-secondary: #000000;
            --text-primary: #e8e8e8;
            --text-secondary: #b8b8b8;
        }
        body.dark-mode .product {
            border: none;
        }
        body.dark-mode .product:hover {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }
        body {
           font-family: 'Cinzel', serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            direction: ltr;
            transition: background-color 0.3s ease, color 0.3s ease;
        }


/* ====== HEADER FIX ====== */

header { background-image: url('bk.jpg'); background-color: black; background-repeat: no-repeat; background-size: contain;
 background-position: center top;

.dark-mode-toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--gold);
    color: white;
    border: none;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    transition: background-color 0.3s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}
.dark-mode-toggle:hover {
    background-color: var(--gold-dark);
    transform: scale(1.08);
}
header {
    position: relative;
}
.language-switcher {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
}
.language-switcher button {
    background-color: #B8860B
;
    color: white;
    border: none;
    padding: 8px 14px;
    margin: 0 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    line-height: 1;
    cursor: pointer;
    border-radius: 5px;
   
}
.language-switcher button:hover {
    background-color:#8B6914;
    transform: scale(1.12) translateY(-8px);
    box-shadow: 0 12px 30px rgba(184, 134, 11, 0.4);
    transition: background-color 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
}
.language-switcher button.active {
    background-color: #B8860B;
}

        .menu {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: var(--bg-secondary);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }



        .category {
            margin-bottom: 40px;
        }
        .category h2 {
    border-bottom: none;
    padding-bottom: 30px;
    padding-top: 30px;
    color: var(--gold);
    text-align: center;
    font-size: 32px;
}

       
        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        @media (max-width: 768px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
        .product {
            background-color: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
                .product img {
                        width: 100%;
                        height: 250px;
                        object-fit: cover;
                        border-radius: 5px;
                        filter: blur(8px);
                        transform: scale(1.02);
                        transition: filter 350ms ease, transform 350ms ease;
                        will-change: transform, filter;
                        display: block;
                }
                .product img.loaded {
                        filter: blur(0);
                        transform: scale(1);
                }

        .product:hover img {
    transform: scale(1.08); /* تكبير خفيف */
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
        .product h3 {
            margin: 10px 0;
            color: var(--text-primary);
        }
        .product p {
            margin: 5px 0;
            color: var(--text-secondary);
        }
        .price {
            font-size: 13px;
            font-weight: bold;
            color: var(--gold);
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #000000;
            color: var(--gold);
            transition: background-color 0.3s ease, color 0.3s ease;

        /* RTL for Arabic and Persian */

        #backToTop {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: var(--gold-dark);
            color: #ffffff;

            display: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;

            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }
        #backToTop.show {
            display: flex;

        let currentLang = 'en';
        let isFirstLoad = true;

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('hot-drinks-title').textContent = translations[lang]['hot-drinks-title'];
            document.getElementById('juices-title').textContent = translations[lang]['juices-title'];
            document.getElementById('mojito-title').textContent = translations[lang]['mojito-title'];
            document.getElementById('shisha-title').textContent = translations[lang]['shisha-title'];
            document.getElementById('footer-text').textContent = translations[lang]['footer-text'];

            // Update body direction
            document.body.className = (lang === 'ar' || lang === 'fa') ? 'rtl' : '';

            // Update active button
            document.querySelectorAll('.language-switcher button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(lang).classList.add('active');

            // Populate products
            ['hot-drinks', 'juices', 'mojito', 'shisha'].forEach(category => {
                const container = document.getElementById(category);
                container.innerHTML = '';
                translations[lang].products[category].forEach(product => {
                    const productDiv = document.createElement('div');
                    productDiv.className = 'product';
                    productDiv.innerHTML = `
                     <img src="${getImage(product.img)}" 
     onerror="this.src='${product.img}'" 
     alt="${product.name}" 
     loading="lazy">

<h3>${product.name}</h3>
<p>${product.desc}</p>
<p class="price">${product.price}</p>

                    `;
                    container.appendChild(productDiv);
                });
                });
                // enhance products (animations, hover, image load)
                enhanceProducts();
                // animate UI only on first load
                if (isFirstLoad) {
                    animateUI();
                    isFirstLoad = false;
                }
            }

        // Event listeners for language buttons
        // helpers: enhance products and animate
        function enhanceProducts() {
            const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            document.querySelectorAll('.product').forEach(product => {
                // hover micro-interaction
                product.addEventListener('mouseenter', () => {
                    if (prefersReduced) return;
                    gsap.to(product, { scale: 1.03, duration: 0.18, ease: 'power2.out' });
                });
                product.addEventListener('mouseleave', () => {
                    if (prefersReduced) return;
                    gsap.to(product, { scale: 1, duration: 0.18, ease: 'power2.out' });
                });

                const img = product.querySelector('img');
                if (!img) return;
                // ensure fallback to jpg if webp missing
                img.addEventListener('error', () => {
                    try { img.src = img.src.replace('.webp', '.jpg'); } catch(e){}
                });
                const onImageLoad = () => {
                    img.classList.add('loaded');
                    if (!window.gsap) return;
                    if (prefersReduced) return;
                    gsap.fromTo(img, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' });
                };
                if (img.complete && img.naturalWidth !== 0) {
                    onImageLoad();
                } else {
                    img.addEventListener('load', onImageLoad, { once: true });
                }
            });
        }

        function animateUI() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (typeof gsap === 'undefined') return;
            gsap.from('#title', { duration: 0.8, y: -18, opacity: 0, ease: 'power2.out' });
            gsap.from('.language-switcher button', { duration: 0.6, y: -10, opacity: 0, stagger: 0.08, ease: 'power2.out' });
            gsap.from('.product', { duration: 0.7, y: 18, opacity: 0, stagger: 0.06, ease: 'power3.out' });
        }
        

        document.getElementById('en').addEventListener('click', () => setLanguage('en'));
        document.getElementById('ar').addEventListener('click', () => setLanguage('ar'));
        document.getElementById('fa').addEventListener('click', () => setLanguage('fa'));

        // Back to Top Button
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('show');
            } else {
                backToTopBtn.classList.remove('show');
            }
        });
        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Dark Mode Toggle
        const darkModeBtn = document.getElementById('darkModeBtn');
        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            darkModeBtn.textContent = '☀️';
        }
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isNowDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isNowDark);
            darkModeBtn.textContent = isNowDark ? '☀️' : '🌙';
        });

        // Initialize with English
        setLanguage('en');
    </script>
