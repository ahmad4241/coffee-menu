<style>

.hin{position:relative;z-index:2}
.lgw{position:relative;width:min(190px,50vw);margin:4px auto 0;pointer-events:none}

.lg-sw{transform:translateX(-40%);animation:sweep 1.4s cubic-bezier(.4,0,.2,1) 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fillin{to{fill-opacity:1;stroke-width:0}}@keyframes sweep{to{transform:translateX(140%)}}@keyframes glow{to{opacity:1}}
.hname,.hsub{margin:0;opacity:0;transform:translateY(8px);animation:up .9s var(--ease) forwards;text-shadow:0 2px 12px #000c}
.hname{margin-top:2px;font-weight:600;font-size:15px;letter-spacing:.02em;color:#E9C46A;animation-delay:2.3s}
.hsub{font-size:12.5px;color:#F3EDE2bf;animation-delay:2.5s}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 14px;max-width:720px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:8px 12px 8px 14px;font-size:13.5px;font-weight:500;min-height:42px;transition:background .35s var(--ease),color .35s,border-color .35s}
[dir="ltr"] .tab{padding:8px 14px 8px 12px}
.tab .ic{width:18px;height:18px;color:var(--gold)}
.tab.on{background:var(--gold);border-color:var(--gold);color:#000}.tab.on .ic{color:#000}
/* sections */
.sec{padding:26px 14px 6px;max-width:720px;margin:0 auto}
.sh{display:flex;align-items:center;gap:12px;margin:0 2px 14px}
.sh .ci{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line);color:var(--gold)}
.sh .ci .ic{width:22px;height:22px}
.sh h2{margin:0;font-size:21px;font-weight:700;line-height:1.3}
.sh small{display:block;color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.card{border:1px solid var(--line);background:var(--sf);border-radius:20px;padding:6px 6px 12px;text-align:start;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s}
.card:active{transform:scale(.97)}
.ph{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:var(--sf2)}
.ph img{width:100%;height:100%;object-fit:cover}
.nop{display:grid;place-items:center;background:radial-gradient(90% 90% at 50% 40%,color-mix(in srgb,var(--gold) 14%,var(--sf2)),var(--sf2))}
.nop .ic{width:40px;height:40px;color:var(--gold);stroke-width:1.2;opacity:.55}
.card b{display:block;margin:10px 8px 0;font-size:14.5px;font-weight:600;line-height:1.45}
.card span{display:block;margin:2px 8px 0;font-size:12px;line-height:1.55;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card em{font-style:normal;display:block;margin:auto 8px 0;padding-top:6px;font-size:14px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.badge{position:absolute;z-index:1;top:7px;inset-inline-start:7px;display:flex;align-items:center;gap:4px;background:#000000a8;color:#F0C866;border-radius:99px;padding:2px 9px 2px 7px;font-size:11px;font-weight:600;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge .ic{width:12px;height:12px;fill:currentColor;stroke:none}
/* popular */
.pops{max-width:720px;margin:0 auto;padding:20px 0 0}
.poph{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-weight:700;font-size:16px}
.poph .ic{width:18px;height:18px;color:var(--gold);fill:var(--gold)}
.prow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 8px;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.prow::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;display:flex;align-items:center;gap:11px;min-width:205px;border:1px solid var(--line);background:var(--sf);border-radius:18px;padding:6px;padding-inline-end:16px;scroll-snap-align:start;box-shadow:var(--shadow);text-align:start;transition:transform .2s}
.pc:active{transform:scale(.97)}
.pc .pt{width:60px;height:60px;border-radius:13px;overflow:hidden;background:var(--sf2);flex:none}
.pc .pt img{width:100%;height:100%;object-fit:cover}
.pc b{display:block;font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap}
.pc small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut);margin-top:1px}
.pc small .ic{width:14px;height:14px;color:var(--gold)}
.pc em{font-style:normal;display:block;font-size:13px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:1px}
.pops+.sec{padding-top:18px}

.sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
.sheet .bd{position:absolute;inset:0;background:#000a;opacity:0;transition:opacity .4s}
.sheet .pn{position:absolute;left:50%;bottom:0;width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;transform:translate(-50%,104%);transition:transform .5s var(--ease);padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.on{pointer-events:auto}.sheet.on .bd{opacity:1}.sheet.on .pn{transform:translate(-50%,0)}

.sp{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--sf2)}
.sp img{width:100%;height:100%;object-fit:cover}

.sp.nop img{display:none}.sp.nop .spi{display:block}
.sx{position:absolute;z-index:2;top:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;border:0;background:#000000a0;color:#fff;display:grid;place-items:center}
.st{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:16px}
.st h3{margin:0;font-size:22px;font-weight:700;line-height:1.35}
.st small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.st em{font-style:normal;flex:none;font-size:18px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;padding-top:3px}
.sd{margin:10px 0 0;color:var(--mut)}

.rin{text-align:center;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);background:var(--sf);border-radius:24px;padding:24px 16px 20px;box-shadow:var(--shadow)}
.rin h2{margin:0;font-size:21px;font-weight:700}
.rin p{margin:4px auto 0;color:var(--mut);font-size:13.5px;max-width:32ch}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 2px;direction:ltr}
.stars button{border:0;background:none;padding:4px;min-width:44px;min-height:44px}

.toast{position:fixed;z-index:90;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--gold);color:#000;font-weight:600;font-size:13.5px;border-radius:99px;padding:10px 18px;box-shadow:0 16px 30px -14px #000;transition:transform .45s var(--ease),opacity .3s;max-width:92%;text-align:center;opacity:0}

.foot{margin-top:60px;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px))}

.arch::after{content:"";position:absolute;inset:0 0 auto;height:220px;background:radial-gradient(50% 80% at 50% 0%,#D6A63A26,transparent);pointer-events:none}
.flg{position:relative;width:min(128px,36vw);margin:0 auto}.flg svg{display:block;width:100%;height:auto}
.ftag{position:relative;margin:10px 0 0;font-size:12.5px;color:#F3EDE299}
.fh{position:relative;margin:26px 0 12px;font-size:15px;font-weight:700;color:#F0C866}
.tiles{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px 14px;border-radius:20px;background:#ffffff0a;border:1px solid #ffffff14;color:inherit;text-decoration:none;transition:background .3s,border-color .3s}

.tl .ic{width:24px;height:24px;color:#F0C866;margin-bottom:4px}
.tl small{font-size:11.5px;color:#F3EDE280}
.tl b{font-size:14px;font-weight:600;line-height:1.45;unicode-bidi:plaintext}
.tl i{font-style:normal;margin-top:6px;font-size:12px;font-weight:700;color:#1A110A;background:#D6A63A;border-radius:99px;padding:4px 14px}
.hrs{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 0;font-size:13.5px;font-weight:500;color:#F3EDE2d9}.hrs .ic{width:18px;height:18px;color:#F0C866}
.soc{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px 0 4px}
.soc a{display:flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:99px;border:1px solid #D6A63A55;color:#F3EDE2;text-decoration:none;font-size:13px;font-weight:500;transition:background .3s,color .3s}
.soc a:hover,.soc a:active{background:#D6A63A;color:#1A110A}
.soc .ic{width:17px;height:17px}
.fbot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:500px;margin:16px auto 0;padding:0 8px;font-size:11.5px;color:var(--mut)}
.fby a{color:var(--gold);text-decoration:none;font-weight:700}
.top{position:fixed;z-index:40;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--gold);display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .35s,transform .35s var(--ease)}
.top.on{opacity:1;transform:none;pointer-events:auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.lg-s{fill-opacity:1;stroke-width:0;stroke-dashoffset:0}.hname,.hsub,.hbar{opacity:1;transform:none}.lg-sw{display:none}.cov img{transform:none}}
</style>
